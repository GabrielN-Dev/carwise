<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarWise</title>
    <link rel="stylesheet" href="assets/css/main.css">
    
<!--  O 'defer' faz o script rodar só DEPOIS do HTML carregar,
   evitando erros e deixando o site mais rápido -->
    <script src="assets/js/main.js" defer></script>
</head>

<body id="home"> <!-- ID para o link de navegação -->
    <nav> <!-- Barra de navegação -->
        <div class="logo"> <!-- Logo do site -->
            <a href="index.html"> <!-- Link para a página inicial -->
                <img src="assets/images/MARCA.png" alt="Logo CarWise" class="logo">
            </a>    
        </div>
        
        <ul class="nav-links"> <!-- Links de navegação -->
            <li><a href="#home">Home</a></li> 
            <li><a href="#servicos">Serviços</a></li>
            <li><a href="#comprar">Comprar</a></li>
            <li><a href="#wise-ia">Wise IA</a></li>
            <li><a href="#artigos">Artigos</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>

        <div class="login"> <!-- Ícone de login e link para a página de login -->
            <img src="assets/images/user_icon.png" alt="Login" class="login-icon">
            <a href="login.html">Login</a>
        </div>
    </nav>
    <main>

        <section class="banner"> <!-- Banner do site -->
            <img src="assets/images/PRIMEIRA_FOTO.png" alt="Banner CarWise">
        </section>

        <form class="search-bar"> <!-- Barra de pesquisa -->
            <button type="submit" class="search-button">
                <img src="assets/images/symbols_search.png" alt="Ícone de pesquisa">
            </button>
            <input type="text" placeholder="Buscar por">
        </form>

        <section class="serviços"> <!-- Seção de serviços -->
            <h1>Serviços</h1>

            <div class="servico_1">
                <img src="assets/images/servico_1.png" alt="Serviços CarWise">
                <h2>Manuntenção</h2>
            </div>

            <div class="servico_2">
                <img src="assets/images/servico_2.png" alt="Serviços CarWise">
                <h2>Limpeza</h2>    
            </div>

            <div class="servico_3">
                <img src="assets/images/servico_3.png" alt="Serviços CarWise">
                <h2>Ferramentas</h2>
            </div>

        </section>
    </main>
</body>

</html>
